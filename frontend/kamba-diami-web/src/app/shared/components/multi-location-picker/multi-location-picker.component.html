<div class="multi-location-picker">
  <div class="picker-row">
    <select [ngModel]="selectedProvinceSlug" (ngModelChange)="onProvinceChange($event)" name="mlpProvince" [disabled]="loadingProvinces()">
      <option [ngValue]="null">{{ loadingProvinces() ? 'A carregar...' : 'Província' }}</option>
      @for (province of provinces; track province.slug) {
        <option [ngValue]="province.slug">{{ province.name }}</option>
      }
    </select>

    <select [ngModel]="selectedMunicipalitySlug" (ngModelChange)="onMunicipalityChange($event)" name="mlpMunicipality" [disabled]="!selectedProvinceSlug">
      <option [ngValue]="null">Município</option>
      @for (municipality of municipalities; track municipality.slug) {
        <option [ngValue]="municipality.slug">{{ municipality.name }}</option>
      }
    </select>
  </div>

  @if (loadError()) {
    <p class="add-error" role="alert">{{ loadError() }}</p>
  }

  @if (selectedLocations.length > 0) {
    <div class="chips">
      @for (location of selectedLocations; track location.municipalitySlug) {
        <span class="chip">
          <svg class="chip-pin" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 21s-6.5-5.6-6.5-11a6.5 6.5 0 0 1 13 0c0 5.4-6.5 11-6.5 11z" /><circle cx="12" cy="10" r="2.3" /></svg>
          {{ location.label }}
          <button type="button" (click)="removeLocation(location.municipalitySlug)" [attr.aria-label]="'Remover ' + location.label">×</button>
        </span>
      }
    </div>
  } @else {
    <p class="hint">Escolhe a província e o município. O município é adicionado à lista automaticamente; podes juntar vários.</p>
  }
</div>
