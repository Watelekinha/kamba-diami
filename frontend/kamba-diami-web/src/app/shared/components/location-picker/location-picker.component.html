<div class="location-picker">
  <div class="field">
    <label>Província</label>
    <select
      [ngModel]="selectedProvinceId"
      (ngModelChange)="onProvinceChange($event)"
      name="province"
    >
      <option [ngValue]="null">Seleccione a província</option>
      @for (province of provinces; track province.id) {
        <option [ngValue]="province.id">{{ province.name }}</option>
      }
    </select>
  </div>

  <div class="field">
    <label>Município</label>
    <select
      [ngModel]="selectedMunicipalityId"
      (ngModelChange)="onMunicipalityChange($event)"
      name="municipality"
      [disabled]="!selectedProvinceId"
    >
      <option [ngValue]="null">Seleccione o município</option>
      @for (municipality of municipalities; track municipality.id) {
        <option [ngValue]="municipality.id">{{ municipality.name }}</option>
      }
    </select>

    @if (selectedProvinceId) {
      @if (!addingMunicipality()) {
        <button type="button" class="add-link" (click)="toggleAddMunicipality()">+ Adicionar município</button>
      } @else {
        <div class="add-row">
          <input
            type="text"
            [(ngModel)]="newMunicipalityName"
            name="newMunicipalityName"
            placeholder="Nome do município"
            maxlength="80"
            (keydown.enter)="$event.preventDefault(); confirmAddMunicipality()"
          />
          <button type="button" class="add-confirm" [disabled]="savingMunicipality() || !newMunicipalityName.trim()" (click)="confirmAddMunicipality()">
            {{ savingMunicipality() ? '...' : 'Adicionar' }}
          </button>
          <button type="button" class="add-cancel" (click)="toggleAddMunicipality()">Cancelar</button>
        </div>
        @if (addError()) {
          <p class="add-error" role="alert">{{ addError() }}</p>
        }
      }
    }
  </div>

  <div class="field">
    <label>Bairro</label>
    <select
      [ngModel]="selectedNeighborhoodId"
      (ngModelChange)="onNeighborhoodChange($event)"
      name="neighborhood"
      [disabled]="!selectedMunicipalityId"
    >
      <option [ngValue]="null">Seleccione o bairro</option>
      @for (neighborhood of neighborhoods; track neighborhood.id) {
        <option [ngValue]="neighborhood.id">{{ neighborhood.name }}</option>
      }
    </select>

    @if (selectedMunicipalityId) {
      @if (!addingNeighborhood()) {
        <button type="button" class="add-link" (click)="toggleAddNeighborhood()">+ Adicionar bairro</button>
      } @else {
        <div class="add-row">
          <input
            type="text"
            [(ngModel)]="newNeighborhoodName"
            name="newNeighborhoodName"
            placeholder="Nome do bairro"
            maxlength="80"
            (keydown.enter)="$event.preventDefault(); confirmAddNeighborhood()"
          />
          <button type="button" class="add-confirm" [disabled]="savingNeighborhood() || !newNeighborhoodName.trim()" (click)="confirmAddNeighborhood()">
            {{ savingNeighborhood() ? '...' : 'Adicionar' }}
          </button>
          <button type="button" class="add-cancel" (click)="toggleAddNeighborhood()">Cancelar</button>
        </div>
        @if (addError()) {
          <p class="add-error" role="alert">{{ addError() }}</p>
        }
      }
    }
  </div>
</div>
