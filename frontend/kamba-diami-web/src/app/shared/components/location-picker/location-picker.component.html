<div class="location-picker">
  @if (loadError()) {
    <p class="add-error" role="alert">{{ loadError() }}</p>
  }

  <div class="field">
    <label>Província</label>
    <select
      [ngModel]="selectedProvinceSlug"
      (ngModelChange)="onProvinceChange($event)"
      name="province"
      [disabled]="loadingProvinces()"
    >
      <option [ngValue]="null">{{ loadingProvinces() ? 'A carregar províncias...' : 'Seleccione a província' }}</option>
      @for (province of provinces; track province.slug) {
        <option [ngValue]="province.slug">{{ province.name }}</option>
      }
    </select>
  </div>

  <div class="field">
    <label>Município</label>
    <select
      [ngModel]="selectedMunicipalitySlug"
      (ngModelChange)="onMunicipalityChange($event)"
      name="municipality"
      [disabled]="!selectedProvinceSlug"
    >
      <option [ngValue]="null">Seleccione o município</option>
      @for (municipality of municipalities; track municipality.slug) {
        <option [ngValue]="municipality.slug">{{ municipality.name }}</option>
      }
    </select>
  </div>

  <div class="field">
    <label>Bairro</label>
    <select
      [ngModel]="selectedNeighborhood"
      (ngModelChange)="onNeighborhoodChange($event)"
      [compareWith]="sameNeighborhood"
      name="neighborhood"
      [disabled]="!selectedMunicipalitySlug"
    >
      <option [ngValue]="null">Seleccione o bairro</option>
      @for (neighborhood of neighborhoods; track neighborhood.id ?? neighborhood.name) {
        <option [ngValue]="neighborhood">{{ neighborhood.name }}</option>
      }
    </select>

    @if (selectedMunicipalitySlug) {
      @if (!addingNeighborhood()) {
        <button type="button" class="add-link" (click)="toggleAddNeighborhood()">+ Adicionar bairro</button>
      } @else {
        <div class="add-row">
          <input
            type="text"
            [(ngModel)]="newNeighborhoodName"
            name="newNeighborhoodName"
            placeholder="Nome do bairro"
            maxlength="80"
            (keydown.enter)="$event.preventDefault(); confirmAddNeighborhood()"
          />
          <button type="button" class="add-confirm" [disabled]="savingNeighborhood() || !newNeighborhoodName.trim()" (click)="confirmAddNeighborhood()">
            {{ savingNeighborhood() ? '...' : 'Adicionar' }}
          </button>
          <button type="button" class="add-cancel" (click)="toggleAddNeighborhood()">Cancelar</button>
        </div>
      }
    }
    @if (addError()) {
      <p class="add-error" role="alert">{{ addError() }}</p>
    }
  </div>
</div>
